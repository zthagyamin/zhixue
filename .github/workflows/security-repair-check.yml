name: Security repair verification
on:
  push:
    branches: [fix/security-isolation-deps-20260915]
  pull_request:
    branches: [refactor/ui-redesign-s1-settings]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # Original Node source-attestation tests need the baseline commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install exact locked dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/security-evidence"
          npm ci --no-audit --no-fund
          python -m pip install -r companion/requirements.txt
          echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Lint
        run: npm run lint
      - name: Types
        if: '!cancelled()'
        run: npm run typecheck
      - name: Build
        if: '!cancelled()'
        run: npm run build
      - name: Original Node regression tests
        if: '!cancelled()'
        timeout-minutes: 8
        run: npm run test:node > "$RUNNER_TEMP/security-evidence/node-tests.log" 2>&1
      - name: Database tooling compatibility, synthetic schema only
        if: '!cancelled()'
        run: node .github/security-drizzle-smoke.mjs > "$RUNNER_TEMP/security-evidence/drizzle-smoke.log" 2>&1
      - name: Export identity and dependency audit
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/security-evidence/source-sha.txt"
          git archive --format=zip --output="$RUNNER_TEMP/security-evidence/source.zip" HEAD
          cp package-lock.json "$RUNNER_TEMP/security-evidence/package-lock.json"
          npm audit --json > "$RUNNER_TEMP/security-evidence/npm-audit.json" || test $? -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-regression
          path: ${{ runner.temp }}/security-evidence
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned runtime and isolated browser tooling
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/browser-driver" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/browser-driver/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real browser Python isolation and functionality
        env:
          UX_BROWSER_DRIVER: ${{ runner.temp }}/browser-driver
          UX_EVIDENCE: ${{ runner.temp }}/security-browser
        run: |
          mkdir -p "$UX_EVIDENCE"
          export TARGET_SHA="$(git rev-parse HEAD)"
          node .github/security-python-browser.mjs > "$UX_EVIDENCE/browser.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-browser
          path: ${{ runner.temp }}/security-browser
          retention-days: 7
  scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scanners and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          export SECURITY_TOOLS="$RUNNER_TEMP/security-tools"
          export SECURITY_EVIDENCE="$RUNNER_TEMP/security-scanners"
          echo "SECURITY_TOOLS=$SECURITY_TOOLS" >> "$GITHUB_ENV"
          echo "SECURITY_EVIDENCE=$SECURITY_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$SECURITY_TOOLS" "$SECURITY_EVIDENCE"
          python -m pip install 'semgrep==1.177.0' 'pip-audit==2.9.0'
          cd "$SECURITY_TOOLS"
          curl -fSL --retry 2 --max-time 120 https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz -o betterleaks.tar.gz
          echo 'efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a  betterleaks.tar.gz' | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          curl -fSL --retry 2 --max-time 120 https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt -o checksums.txt
          echo 'bc701c3c3ee8b9acbea2c23257e41381e3854888f51281616a6ba5dc96963821  checksums.txt' | sha256sum -c -
          curl -fSL --retry 2 --max-time 120 https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o trivy_0.74.0_Linux-64bit.tar.gz
          grep ' trivy_0.74.0_Linux-64bit.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
      - name: Re-scan immutable source and packaged Python dependencies
        run: python .github/security-rescan.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-scanners
          path: ${{ runner.temp }}/security-scanners
          retention-days: 7
