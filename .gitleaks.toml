title = "Zhixue: default rules with one reviewed synthetic-digest exception"
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Deterministic SHA-256 exposure identities in the cross-runtime math fixture; never authentication credentials"
condition = "AND"
paths = ['''(^|/)tests/fixtures/stage3-math-variant-parity\.json$''']
regexTarget = "match"
regexes = ['''exposureKey"\s*:\s*"[a-f0-9]{64}"''']
